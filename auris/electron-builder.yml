appId: com.auris.desktop
productName: Auris
copyright: Copyright © Auris
directories:
  output: release
  buildResources: build
# 自动更新发布源。electron-builder 用它生成 app-update.yml（打进包里），
# electron-updater 在运行时读同一份配置去查 latest-mac.yml / latest.yml。
# 不配 publish 时 electron-updater 会抛 "provider is not configured"，
# 主进程的 app-updater 会把它归类成 UPDATE_FEED_NOT_CONFIGURED 并在 UI 里
# 明说"未配置更新源"，而不是伪装成网络错误。
publish:
  - provider: github
    owner: xhslam
    repo: auris
    # 先由标签工作流创建草稿并上传多平台资产；全部元数据验证后才提升为正式 Release。
    releaseType: draft
files:
  - electron/**/*
  # Assembled MCP/runtime closure (scripts/assemble-electron-runtime-deps.cjs).
  # Explicit so electron-builder does not skip nested node_modules.
  - electron/node_modules/**/*
  - assets/**/*
  - package.json
  - "!node_modules/**/*"
  - node_modules/ws/**/*
  - node_modules/@homebridge/node-pty-prebuilt-multiarch/**/*
  - node_modules/node-pty/**/*
  # node-pty resolves natives as build/Release -> build/Debug -> prebuilds/<os>-<arch>.
  # build/ here is whatever the install host compiled (a Mach-O pty.node when the
  # tree came from macOS), which is dead weight in a Windows package and makes the
  # loader try a doomed require before falling through. prebuilds/ already ships
  # darwin-arm64, darwin-x64 and win32-x64, so dropping build/ costs us nothing.
  - "!node_modules/node-pty/build/**"
  # Debug symbols: ~6 MB per .pdb, several dozen MB total, never loaded at runtime.
  - "!node_modules/**/*.pdb"
  # AppleDouble sidecars from copying the tree off macOS.
  - "!node_modules/**/._*"
# electron-builder skips nested directories named node_modules inside a
# generic extraResources copy; name them explicitly so Next standalone works.
extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      - "!node_modules"
      - "!node_modules/**"
      - "!.next"
      - "!.next/**"
      - "!**/.shadowing-data"
      - "!**/.shadowing-data/**"
      - "!**/.env*"
  - from: .next/standalone/node_modules
    to: standalone/node_modules
  - from: .next/standalone/.next
    to: standalone/.next
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**"
  - "**/*.node"
mac:
  icon: assets/app-icon.icns
  category: public.app-category.education
  # zip 是 macOS 自动更新的必需产物：electron-updater 在 mac 上只能从 zip
  # 做增量/就地替换，dmg 仅供人工下载。两个一起出，dmg 继续当手动分发口。
  target:
    - dmg
    - zip
  # 正式 Release 由 GitHub Actions 提供 CSC_LINK / CSC_KEY_PASSWORD，
  # electron-builder 会自动导入并选用 Developer ID Application 证书。
  # 不固定为 ad-hoc identity，否则 macOS 无法就地安装更新。
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Auris
win:
  icon: assets/app-icon.png
  target:
    # NSIS is the native Windows installer; zip remains useful for portable smoke tests.
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # Cross-build from macOS: do not rebuild native modules on the host.
  # node-pty / sharp ship platform prebuilds instead.
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Auris
# Default true is fine for same-platform Mac builds; Windows cross-builds
# pass --config.npmRebuild=false from the desktop:build:win script.
npmRebuild: true
