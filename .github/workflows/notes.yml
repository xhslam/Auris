name: Notes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/notes.yml"
      - "electron/auris-notes-mcp-server.mjs"
      - "electron/notes-mcp-bridge.cjs"
      - "electron/main.cjs"
      - "electron/terminal-*.cjs"
      - "electron/preload.cjs"
      - "electron-builder.yml"
      - "build/entitlements.mac*.plist"
      - "src/platform/desktop/desktop-bridge.ts"
      - "src/app/review/**"
      - "src/components/review/**"
      - "src/features/output-review/**"
      - "tests/unit/electron/terminal-*.test.ts"
      - "tests/unit/electron/macos-terminal-permissions.test.ts"
      - "tests/fixtures/notes/**"
      - "scripts/verify-markdown-patches.cjs"
      - "scripts/markdown-patch-contract.json"
      - "scripts/verify-macos-terminal-permissions.cjs"
      - "scripts/assemble-electron-runtime-deps.cjs"
      - "scripts/local-update-win*.cjs"
      - "scripts/local-update-win.test.mjs"
      - "tests/unit/electron/electron-runtime-deps.test.ts"
      - "docs/windows-local-update.md"
      - "src/components/notes-v2/**"
      - "src/features/notes/**"
      - "src/platform/notes/**"
      - "tests/component/notes/**"
      - "tests/component/review/**"
      - "tests/unit/notes/**"
      - "tests/unit/output-review/**"
      - "tests/unit/vmark/**"
      - "tests/e2e/review-home.spec.ts"
      - "tests/unit/electron/auris-notes-mcp-server.test.ts"
      - "tests/unit/electron/notes-mcp-bridge.test.ts"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/check-singleton-deps*.mjs"
      - "scripts/verify-micromark-build.cjs"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/notes.yml"
      - "electron/auris-notes-mcp-server.mjs"
      - "electron/notes-mcp-bridge.cjs"
      - "electron/main.cjs"
      - "electron/terminal-*.cjs"
      - "electron/preload.cjs"
      - "electron-builder.yml"
      - "build/entitlements.mac*.plist"
      - "src/platform/desktop/desktop-bridge.ts"
      - "src/app/review/**"
      - "src/components/review/**"
      - "src/features/output-review/**"
      - "tests/unit/electron/terminal-*.test.ts"
      - "tests/unit/electron/macos-terminal-permissions.test.ts"
      - "tests/fixtures/notes/**"
      - "scripts/verify-markdown-patches.cjs"
      - "scripts/markdown-patch-contract.json"
      - "scripts/verify-macos-terminal-permissions.cjs"
      - "scripts/assemble-electron-runtime-deps.cjs"
      - "scripts/local-update-win*.cjs"
      - "scripts/local-update-win.test.mjs"
      - "tests/unit/electron/electron-runtime-deps.test.ts"
      - "docs/windows-local-update.md"
      - "src/components/notes-v2/**"
      - "src/features/notes/**"
      - "src/platform/notes/**"
      - "tests/component/notes/**"
      - "tests/component/review/**"
      - "tests/unit/notes/**"
      - "tests/unit/output-review/**"
      - "tests/unit/vmark/**"
      - "tests/e2e/review-home.spec.ts"
      - "tests/unit/electron/auris-notes-mcp-server.test.ts"
      - "tests/unit/electron/notes-mcp-bridge.test.ts"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/check-singleton-deps*.mjs"
      - "scripts/verify-micromark-build.cjs"

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check editor dependency identity
        run: npm run quality:singleton-deps

      - name: Lint notes surface
        run: npm run lint

      - name: MCP health check
        run: npm run mcp:notes -- --health-check

      - name: Local Windows updater gates and rollback contract
        run: |
          npm run quality:local-update-win
          npx vitest run tests/unit/electron/electron-runtime-deps.test.ts -t 'restores the old closure'

      - name: Unit and component notes tests
        run: >
          npm test --
          tests/unit/notes/
          tests/component/notes/
          tests/component/review/
          tests/unit/output-review/
          tests/unit/vmark/
          tests/unit/electron/terminal-session-manager.test.ts
          tests/unit/electron/terminal-transcript-service.test.ts
          tests/unit/electron/macos-terminal-permissions.test.ts
          tests/unit/electron/auris-notes-mcp-server.test.ts
          tests/unit/electron/notes-mcp-bridge.test.ts
