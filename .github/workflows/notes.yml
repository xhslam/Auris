name: Notes

on:
  pull_request:
    paths:
      - ".github/workflows/notes.yml"
      - "electron/auris-notes-mcp-server.mjs"
      - "electron/notes-mcp-bridge.cjs"
      - "electron/main.cjs"
      - "src/components/notes-v2/**"
      - "src/features/notes/**"
      - "src/platform/notes/**"
      - "tests/component/notes/**"
      - "tests/unit/notes/**"
      - "tests/unit/electron/auris-notes-mcp-server.test.ts"
      - "tests/unit/electron/notes-mcp-bridge.test.ts"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/check-singleton-deps*.mjs"
      - "scripts/verify-micromark-build.cjs"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/notes.yml"
      - "electron/auris-notes-mcp-server.mjs"
      - "electron/notes-mcp-bridge.cjs"
      - "electron/main.cjs"
      - "src/components/notes-v2/**"
      - "src/features/notes/**"
      - "src/platform/notes/**"
      - "tests/component/notes/**"
      - "tests/unit/notes/**"
      - "tests/unit/electron/auris-notes-mcp-server.test.ts"
      - "tests/unit/electron/notes-mcp-bridge.test.ts"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/check-singleton-deps*.mjs"
      - "scripts/verify-micromark-build.cjs"

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check editor dependency identity
        run: npm run quality:singleton-deps

      - name: Lint notes surface
        run: npm run lint

      - name: MCP health check
        run: npm run mcp:notes -- --health-check

      - name: Unit and component notes tests
        run: >
          npm test --
          tests/unit/notes/notes-mcp-request-handler.test.ts
          tests/unit/notes/notes-mcp-workspace-handler.test.ts
          tests/unit/notes/notes-mcp-contract.test.ts
          tests/unit/notes/notes-markdown-nesting.test.ts
          tests/unit/notes/vault-safe-write.test.ts
          tests/unit/notes/vault-write-conflict.test.ts
          tests/unit/notes/workspace-store.test.ts
          tests/unit/electron/auris-notes-mcp-server.test.ts
          tests/unit/electron/notes-mcp-bridge.test.ts
          tests/component/notes/notes-workbench.test.tsx
          tests/component/notes/notes-rich-editor-sync.test.tsx
          tests/component/notes/notes-file-tree.test.tsx
