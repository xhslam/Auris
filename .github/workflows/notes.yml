name: Notes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/notes.yml"
      - "electron/auris-notes-mcp-server.mjs"
      - "electron/notes-mcp-bridge.cjs"
      - "electron/main.cjs"
      - "electron/terminal-*.cjs"
      - "electron/preload.cjs"
      - "electron-builder.yml"
      - "build/entitlements.mac*.plist"
      - "src/platform/desktop/desktop-bridge.ts"
      - "src/app/review/**"
      - "src/components/review/**"
      - "src/features/output-review/**"
      - "tests/unit/electron/terminal-*.test.ts"
      - "tests/unit/electron/macos-terminal-permissions.test.ts"
      - "tests/fixtures/notes/**"
      - "scripts/verify-markdown-patches.cjs"
      - "scripts/markdown-patch-contract.json"
      - "scripts/verify-macos-terminal-permissions.cjs"
      - "scripts/assemble-electron-runtime-deps.cjs"
      - "scripts/local-update-win*.cjs"
      - "scripts/local-update-win.test.mjs"
      - "tests/unit/electron/electron-runtime-deps.test.ts"
      - "docs/windows-local-update.md"
      - "src/components/notes-v2/**"
      - "src/features/notes/**"
      - "src/platform/notes/**"
      - "tests/component/notes/**"
      - "tests/component/review/**"
      - "tests/unit/notes/**"
      - "tests/unit/output-review/**"
      - "tests/unit/vmark/**"
      - "tests/e2e/review-home.spec.ts"
      - "tests/electron/notes-terminal-windows-smoke.cjs"
      - "src/app/globals.css"
      - "next.config.ts"
      - "tests/unit/electron/auris-notes-mcp-server.test.ts"
      - "tests/unit/electron/notes-mcp-bridge.test.ts"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/check-singleton-deps*.mjs"
      - "scripts/verify-micromark-build.cjs"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/notes.yml"
      - "electron/auris-notes-mcp-server.mjs"
      - "electron/notes-mcp-bridge.cjs"
      - "electron/main.cjs"
      - "electron/terminal-*.cjs"
      - "electron/preload.cjs"
      - "electron-builder.yml"
      - "build/entitlements.mac*.plist"
      - "src/platform/desktop/desktop-bridge.ts"
      - "src/app/review/**"
      - "src/components/review/**"
      - "src/features/output-review/**"
      - "tests/unit/electron/terminal-*.test.ts"
      - "tests/unit/electron/macos-terminal-permissions.test.ts"
      - "tests/fixtures/notes/**"
      - "scripts/verify-markdown-patches.cjs"
      - "scripts/markdown-patch-contract.json"
      - "scripts/verify-macos-terminal-permissions.cjs"
      - "scripts/assemble-electron-runtime-deps.cjs"
      - "scripts/local-update-win*.cjs"
      - "scripts/local-update-win.test.mjs"
      - "tests/unit/electron/electron-runtime-deps.test.ts"
      - "docs/windows-local-update.md"
      - "src/components/notes-v2/**"
      - "src/features/notes/**"
      - "src/platform/notes/**"
      - "tests/component/notes/**"
      - "tests/component/review/**"
      - "tests/unit/notes/**"
      - "tests/unit/output-review/**"
      - "tests/unit/vmark/**"
      - "tests/e2e/review-home.spec.ts"
      - "tests/electron/notes-terminal-windows-smoke.cjs"
      - "src/app/globals.css"
      - "next.config.ts"
      - "tests/unit/electron/auris-notes-mcp-server.test.ts"
      - "tests/unit/electron/notes-mcp-bridge.test.ts"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/check-singleton-deps*.mjs"
      - "scripts/verify-micromark-build.cjs"

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check editor dependency identity
        run: npm run quality:singleton-deps

      - name: Lint notes surface
        run: npm run lint

      - name: MCP health check
        run: npm run mcp:notes -- --health-check

      - name: Local Windows updater gates and rollback contract
        run: |
          npm run quality:local-update-win
          npx vitest run tests/unit/electron/electron-runtime-deps.test.ts -t 'restores the old closure'

      - name: Unit and component notes tests
        run: >
          npm test --
          tests/unit/notes/
          tests/component/notes/
          tests/component/review/
          tests/unit/output-review/
          tests/unit/vmark/
          tests/unit/electron/terminal-session-manager.test.ts
          tests/unit/electron/terminal-transcript-service.test.ts
          tests/unit/electron/macos-terminal-permissions.test.ts
          tests/unit/electron/auris-notes-mcp-server.test.ts
          tests/unit/electron/notes-mcp-bridge.test.ts

  notes-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_SMOKE_OUT: ${{ runner.temp }}/notes-terminal-windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepare evidence directory
        run: New-Item -ItemType Directory -Force -Path $env:WINDOWS_SMOKE_OUT | Out-Null

      - name: Install dependencies
        run: |
          npm ci 2>&1 | Tee-Object -FilePath "$env:WINDOWS_SMOKE_OUT/install.log"
          exit $LASTEXITCODE

      - name: Build production app
        run: |
          npm run build 2>&1 | Tee-Object -FilePath "$env:WINDOWS_SMOKE_OUT/build.log"
          exit $LASTEXITCODE

      - name: Windows terminal smoke
        timeout-minutes: 10
        run: |
          node tests/electron/notes-terminal-windows-smoke.cjs --out "$env:WINDOWS_SMOKE_OUT" 2>&1 | Tee-Object -FilePath "$env:WINDOWS_SMOKE_OUT/smoke.log"
          exit $LASTEXITCODE

      # Upload only diagnostics, not the isolated Vault or Electron profile.
      # Early install/build/launch failures may have logs but no screenshot.
      - name: Upload Windows terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-terminal-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WINDOWS_SMOKE_OUT }}/evidence.json
            ${{ env.WINDOWS_SMOKE_OUT }}/*.png
            ${{ env.WINDOWS_SMOKE_OUT }}/*.log
          if-no-files-found: warn
          retention-days: 14
